version: 2

models:
  - name: slv_olist_clientes
    description: "Tabela de clientes tratados a partir da camada Bronze."

    columns:
      - name: id_cliente
        description: "Identificador do cliente no pedido."
        tests:
          - not_null

      - name: id_cliente_unico
        description: "Identificador único do cliente."
        tests:
          - not_null

      - name: cidade_cliente
        description: "Prefixo do CEP do cliente."

      - name: estado_cliente
        description: "Estado do cliente."

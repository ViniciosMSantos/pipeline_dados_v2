x-airflow-common: &airflow-common
  build:
    context: .
    dockerfile: docker/airflow/Dockerfile
  environment: &airflow-common-env
    AIRFLOW__CORE__EXECUTOR: LocalExecutor
    AIRFLOW__DATABASE__SQL_ALCHEMY_CONN: postgresql+psycopg2://airflow:airflow@postgres/airflow
    AIRFLOW__CORE__LOAD_EXAMPLES: "false"
    AIRFLOW__CORE__DAGS_ARE_PAUSED_AT_CREATION: "true"
    AIRFLOW__API__EXPOSE_CONFIG: "false"
    # Equivalente mais próximo do antigo AIRFLOW__WEBSERVER__WEB_SERVER_MASTER_TIMEOUT
    # (não existe mais "master timeout" no api-server); mantém margem generosa
    # de boot pelo mesmo motivo do fix original em 2.x.
    AIRFLOW__API__WORKER_TIMEOUT: "300"
    # FAB deixou de ser o auth manager padrão no Airflow 3 (agora é o
    # SimpleAuthManager); mantido explicitamente para preservar o login
    # fixo admin/admin via `airflow users create`.
    AIRFLOW__CORE__AUTH_MANAGER: airflow.providers.fab.auth_manager.fab_auth_manager.FabAuthManager
    # No Airflow 3 as tasks falam com o api-server via HTTP (Task Execution
    # API) em vez de acessar o banco direto; sem isso o cliente tenta
    # "localhost:8080", que não existe no container do scheduler/dag-processor.
    AIRFLOW__CORE__EXECUTION_API_SERVER_URL: http://airflow-api-server:8080/execution/
    # Precisa ser idêntico entre scheduler, dag-processor e api-server para
    # validar os tokens JWT da Task Execution API entre containers.
    AIRFLOW__API_AUTH__JWT_SECRET: ${AIRFLOW_JWT_SECRET}
    # Repassados para dentro das tasks (BashOperator) que chamam `docker run` no host,
    # por isso precisam ser caminhos do HOST, não do container do Airflow.
    DBT_DATABRICKS_TOKEN: ${DBT_DATABRICKS_TOKEN:-}
    DBT_CORE_HOST_PATH: ${DBT_CORE_HOST_PATH:-}
    DBT_PROFILES_HOST_PATH: ${DBT_PROFILES_HOST_PATH:-}
  volumes:
    - ./airflow/dags:/opt/airflow/dags
    - ./airflow/logs:/opt/airflow/logs
    - ./airflow/plugins:/opt/airflow/plugins
    # Docker-outside-of-Docker: permite que as tasks rodem `docker run` usando o daemon do host.
    - /var/run/docker.sock:/var/run/docker.sock
  user: "${AIRFLOW_UID:-50000}:0"
  group_add:
    - "${DOCKER_GID:-999}"
  depends_on:
    postgres:
      condition: service_healthy

services:
  postgres:
    image: postgres:16
    environment:
      POSTGRES_USER: airflow
      POSTGRES_PASSWORD: airflow
      POSTGRES_DB: airflow
    volumes:
      - postgres-db-volume:/var/lib/postgresql/data
    healthcheck:
      test: ["CMD", "pg_isready", "-U", "airflow"]
      interval: 5s
      retries: 5
    restart: always

  airflow-init:
    <<: *airflow-common
    environment:
      <<: *airflow-common-env
      # A imagem 3.x resolve o pacote `airflow` via site-packages do usuário
      # (baseado em $HOME); como este serviço roda como root (user: "0:0")
      # e pula o entrypoint padrão, $HOME viraria /root e o `airflow` CLI
      # não encontraria o próprio módulo.
      HOME: /home/airflow
    entrypoint: /bin/bash
    command:
      - -c
      - |
        airflow config update --fix
        airflow db migrate
        airflow users create \
          --username "${_AIRFLOW_WWW_USER_USERNAME:-admin}" \
          --password "${_AIRFLOW_WWW_USER_PASSWORD:-admin}" \
          --firstname Admin \
          --lastname User \
          --role Admin \
          --email admin@example.com || true
        chown -R "${AIRFLOW_UID:-50000}:0" /opt/airflow/{dags,logs,plugins}
    user: "0:0"

  airflow-api-server:
    <<: *airflow-common
    command: api-server
    ports:
      - "8080:8080"
    healthcheck:
      test: ["CMD", "curl", "--fail", "http://localhost:8080/api/v2/monitor/health"]
      interval: 30s
      timeout: 10s
      retries: 5
    restart: always
    depends_on:
      airflow-init:
        condition: service_completed_successfully

  airflow-scheduler:
    <<: *airflow-common
    command: scheduler
    restart: always
    depends_on:
      airflow-init:
        condition: service_completed_successfully

  airflow-dag-processor:
    <<: *airflow-common
    command: dag-processor
    restart: always
    depends_on:
      airflow-init:
        condition: service_completed_successfully

volumes:
  postgres-db-volume:
